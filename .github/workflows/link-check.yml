name: Link check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check links in profile docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --accept 200,429
            --exclude '^https://(www\.)?linkedin\.com/'
            README.md MAINTENANCE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
